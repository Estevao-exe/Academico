<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeira do Brasil</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .brasil-flag {
            position: relative;
            background-color: #009b3a;
            width: 250px;
            height: 150px;
        }

        .brasil-flag .losangle {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #ffdf00;
            clip-path: polygon(50% 7%, 93% 50%, 50% 93%, 7% 50%);
        }

        .brasil-flag .circle {
            position: absolute;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #002776;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
        }

        .brasil-flag .circle::before{
            content: '';
            position: absolute;
            width: 90px;
            height: 10px;
            background-color: white;
            top: 27px;
            left: -13px;
            transform: rotate(14deg);
        }
    </style>
</head>
<body>
    <div class="brasil-flag">
        <div class="losangle"></div>
        <div class="circle"></div>
        

    </div>

</body>
</html>
